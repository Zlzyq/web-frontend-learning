<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="public.css">
</head>
<body>
    
    <p>内联样式是直接在HTML元素的style属性中定义的样式，它只对当前元素生效。内联样式的优先级最高，会覆盖外部样式表和内部样式表中的样式。</p>
    <p style="color: red; font-size: 20px; text-align: center;">这是一个段落，使用了内联样式。</p>
    <a href ="./外部.html">外部样式表</a>
</body>
</html>
