<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: rgb(136, 227, 141);
            padding: 50px 10px;
            border: 10px solid rgb(0, 0, 0);
            margin: 50px;
        }
    </style>
</head>
<body>
    <!--padding是内边距 然后border是边框 然后 margin是外边距 这些
    都是用来 让元素有更大的点击区域或者更好的视觉效果-->
    <div>我是内容</div>
</body>
</html>
