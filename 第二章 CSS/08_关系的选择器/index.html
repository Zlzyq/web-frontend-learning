<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li {
            list-style-type: square;
            color: red;
        }
    </style>
</head>

<body>
    <!--ul的后代 所有的li元素都会生效-->
    <ul>
        <li>小猫</li>
        <li>小狗</li>
        <li>小兔</li>
        <li>小鸟</li>
        <li>小鱼</li>
        <li>小马</li>
        <div>
            <ol>
                <li>小猫</li>
                <li>小狗</li>
                <li>小兔</li>
                <li>小鸟</li>
                <li>小鱼</li>
                <li>小马</li>
            </ol>
        </div>
    </ul>



</body>

</html>
