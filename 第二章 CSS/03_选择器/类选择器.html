<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #paragraph1 {
            color: red;
            font-size: 20px;
        }
        #paragraph2 {
            color: blue;
            font-size: 20px;
        }
        #paragraph3 {
            color: green;
            font-size: 20px;
        }
        .centor {
            text-align: center;
            color: rgba(83, 5, 9, 0.216);
            font-size: 20px;
        }
        .centor-order {
            text-align: center;
            color: rgb(105, 127, 134);
            font-size: 20px;
        }
    </style>
</head>
<body>
    
<p id="paragraph1">表格的单元格可以通过设置rowspan和colspan属性来实现跨行和跨列的效果。rowspan属性表示单元格跨越的行数，colspan属性表示单元格跨越的列数。</p>
<p id="paragraph2">我是第一个段落</p>
<p id="paragraph3">我是第二个段落</p>
<p class="centor">我是第三个段落</p>
<p class="centor-order">我是第四个段落</p>
</body>
</html>
