<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            color: red;
            font-size: 20px;
        }
        span {
            color: blue;
            font-size: 30px;
        }
    </style>
</head>
<body>

    <p>表格的单元格可以通过设置rowspan和colspan属性来实现跨行和跨列的效果。rowspan属性表示单元格跨越的行数，colspan属性表示单元格跨越的列数。</p>
    <p>我是第一个段落</p>
    <p>我是第二个段落</p>
    <p>我想学完前端<span>知识</span>再学java</p>
</body>
</html>
