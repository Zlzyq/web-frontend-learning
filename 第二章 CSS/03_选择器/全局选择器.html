<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            color: red;
            font-size: 20px;
        }
        h3{
            color: rgb(192, 157, 74);
            font-size: 18px;
        }
    </style>
</head>
<body>

    <p>表格的单元格可以通过设置rowspan和colspan属性来实现跨行和跨列的效果。rowspan属性表示单元格跨越的行数，colspan属性表示单元格跨越的列数。</p>
    <h3>rowspan属性</h3>
    <ul>
        <li>rowspan属性表示单元格跨越的行数。</li>
        <li>rowspan属性的值必须是大于等于1的整数。</li>
        <li>rowspan属性的默认值是1，表示单元格不跨行。</li>
</body>
</html>
