<!DOCTYPE html>

<body>

    <p>表格是由行和列组成的二维数据结构。HTML中使用
    <table>标签来创建表格，<tr>标签表示表格中的一行，<td>标签表示表格中的一个单元格。</p>

                <table border="1" width="500" cellspacing="0" cellpadding="10">
                    <tr>
                        <td>单元格1</td>
                        <td>单元格2</td>
                        <td>单元格3</td>
                        <td rowspan="2">单元格4</td>
                        <td>单元格5</td>
                    </tr>
                    <tr>
                        <td colspan="2">单元格6</td>
                        <td>单元格8</td>

<p>表格的单元格可以通过设置rowspan和colspan属性来实现跨行和跨列的效果。rowspan属性表示单元格跨越的行数，colspan属性表示单元格跨越的列数。</p>

                        <td>单元格9</td>
                        <td>单元格10</td>
                    </tr>
                    <tr>
                        <td>单元格1</td>
                        <td>单元格2</td>
                        <td>单元格3</td>
                        <td>单元格4</td>
                        <td>单元格5</td>
                    </tr>
                </table>
                <table>
                    <tr>
                        <td>姓名</td>
                        <td>年龄</td>
                        <td>性别</td>
                    </tr>
                    <tr>
                        <td>姓名</td>
                        <td>年龄</td>
                        <td>性别</td>
                    </tr>
                    <tr>
                        <td>姓名</td>
                        <td>年龄</td>
                        <td>性别</td>
                    </tr>
                </table>
</body>

</html>
