<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //程序的开始位置永远式0
        var str = "Hello, World!";
        console.log("字符串长度:", str.length); // 输出字符串长度
        console.log("字符串索引0的字符:", str.charAt(0)); // 输出索引0的字符
        console.log("字符串索引1的字符:", str.charAt(1)); // 输出索引1的字符
        console.log("字符串索引2的字符:", str.charAt(2)); // 输出索引2的字符
        console.log("字符串索引3的字符:", str.charAt(3)); // 输出索引3的字符
        console.log("字符串索引4的字符:", str.charAt(4)); // 输出索引4的字符
        //打印出来最后一个字符
        console.log("字符串索引最后一个字符:", str.charAt(str.length - 1)); // 输出最后一个字符

        //超出取值范围的 都是返回空字符串
    </script>


</body>

</html>
